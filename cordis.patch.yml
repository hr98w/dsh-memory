# dsh-memory contributes one Host plugin; its browser half is discovered through dsh.client.
# The standard DSH Web Connection row reads `webStartup` for its config and still accesses
# `webServer` from its own provider context to register generic RPC channels; keep both
# provider dependencies. Module-level dependencies such as `credentials` still merge.
- id: connection
  name: '@deepseek-ai/dsh-client-connection'
  inject: [webStartup, webServer]

- insert:
    - id: dsh-memory
      name: '@hr98w/dsh-memory'
